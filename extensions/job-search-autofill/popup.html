<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Job Autofill</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #10b981;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .candidate-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .candidate-name {
      font-weight: 600;
      color: #38bdf8;
      font-size: 13px;
    }
    .candidate-sub {
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
      margin-bottom: 10px;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #334155;
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Job Autofill</div>
    <div class="badge">0 Tokens</div>
  </div>

  <div class="candidate-card">
    <div class="candidate-name">Himanshu Dahiya</div>
    <div class="candidate-sub">B.Tech ECE (DCRUST Murthal, 2024–2028)</div>
    <div class="candidate-sub">Full-Stack & Product Designer</div>
  </div>

  <button id="autofill-btn" class="btn-primary">
    ⚡ 1-Click Autofill Form
  </button>

  <button id="copy-portfolio-btn" class="btn-secondary">
    🔗 Copy Portfolio Links
  </button>

  <button id="copy-tracex-btn" class="btn-secondary">
    📋 Copy TraceX Initiative Essay
  </button>

  <div class="footer">
    <span>Works on Ashby, Greenhouse, Lever, YC</span>
    <span id="status-text">Ready</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
